# DPO Digital Dak — Nginx HTTPS reverse proxy template (office LAN).
# Install:
#   sudo cp deploy/nginx-dpo-dak.conf /etc/nginx/sites-available/dpo-dak
#   sudo ln -s /etc/nginx/sites-available/dpo-dak /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates: use the department-issued certificate, or create a LAN CA:
#   sudo openssl req -x509 -nodes -newkey rsa:2048 -days 825 \
#     -keyout /etc/ssl/private/dpo-dak.key -out /etc/ssl/certs/dpo-dak.crt \
#     -subj "/CN=dak.office.lan"

server {
    listen 80;
    server_name dak.office.lan;
    # ACME/renewal convenience; day-to-day traffic is HTTPS-only
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dak.office.lan;

    ssl_certificate     /etc/ssl/certs/dpo-dak.crt;
    ssl_certificate_key /etc/ssl/private/dpo-dak.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # Dak uploads allow files up to 20 MB plus multipart overhead.
    client_max_body_size 25m;

    # Real client IP/protocol for the app's audit trail and secure cookies.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # Never cache private documents at the proxy.
    location /api/documents/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }

    access_log /var/log/nginx/dpo-dak-access.log;
    error_log  /var/log/nginx/dpo-dak-error.log;
}
