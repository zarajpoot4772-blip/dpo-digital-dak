name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the committed source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Smoke tests against the live preview server
        run: |
          set -euo pipefail
          npm run preview > /tmp/preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "Preview server failed to become ready:"
            cat /tmp/preview.log
            exit 1
          fi
          npm run test:smoke

      - name: Show preview server log on failure
        if: failure()
        run: cat /tmp/preview.log
